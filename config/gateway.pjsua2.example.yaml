sip:
  backend: pjsua2
  bindAddress: 0.0.0.0
  port: 5060
  transport: UDP
  ipVersion: IPv4
  codec: PCMU
  # 空の場合、REGISTER応答のVia received/rportからNAT external側IPを自動検出する。
  # 自動検出を使わず固定したい場合は、router/NATのexternal側IPまたは名前を指定する。
  publicContactAddress: ""

registration:
  domain: example.com
  userName: bot-gateway
  password: ${SIP_REGISTRATION_PASSWORD}
  sipAddress: sip:bot-gateway@example.com
  registryServerAddress: registrar.example.com
  registryServerPort: 5060

openai:
  apiKey: ${OPENAI_API_KEY}
  realtimeModel: gpt-realtime
  voice: shimmer
  maxOutputTokens: inf
  turnDetectionType: semantic_vad
  turnDetectionEagerness: low

bot:
  systemInstructions: "あなたは電話応対を行うAIアシスタントです。回答は原則1文、できるだけ短く、相手が話し終わるまで待ってから返答してください。柔らかく落ち着いた女性的な声の印象で話してください。"
  initialGreeting: "こちらはAI電話受付です。ご用件をお話しください。"

logging:
  level: INFO
