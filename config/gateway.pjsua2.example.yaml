gateway:
  sessionIds: session-1,session-2

session.session-1:
  sip.backend: pjsua2
  sip.bindAddress: 0.0.0.0
  sip.port: 5070
  sip.transport: UDP
  sip.ipVersion: IPv4
  sip.codec: PCMU
  sip.preferredCodec: G722
  sip.codecs: G722,PCMU
  sip.publicContactAddress: ""
  sip.rtpPortStart: 40000
  sip.rtpPortEnd: 41000
  registration.domain: example.com
  registration.userName: bot-gateway-1
  registration.password: ${SIP_REGISTRATION_PASSWORD_1}
  registration.sipAddress: sip:bot-gateway-1@example.com
  registration.registryServerAddress: registrar.example.com
  registration.registryServerPort: 5060
  openai.apiKey: ${OPENAI_API_KEY}
  openai.realtimeModel: gpt-realtime
  openai.voice: coral
  openai.maxOutputTokens: inf
  openai.turnDetectionType: semantic_vad
  openai.turnDetectionEagerness: low
  openai.transcriptLoggingEnabled: true
  openai.inputTranscriptionModel: gpt-realtime-whisper
  openai.inputTranscriptionLanguage: ja
  bot.systemInstructions: "あなたはsession-1の電話応対を行うAIアシスタントです。回答は原則1文、できるだけ短く、相手が話し終わるまで待ってから返答してください。"
  bot.initialGreeting: "こちらは一番窓口です。ご用件をお話しください。"

session.session-2:
  sip.backend: pjsua2
  sip.bindAddress: 0.0.0.0
  sip.port: 5072
  sip.transport: UDP
  sip.ipVersion: IPv4
  sip.codec: PCMU
  sip.preferredCodec: G722
  sip.codecs: G722,PCMU
  sip.publicContactAddress: ""
  sip.rtpPortStart: 41002
  sip.rtpPortEnd: 42000
  registration.domain: example.com
  registration.userName: bot-gateway-2
  registration.password: ${SIP_REGISTRATION_PASSWORD_2}
  registration.sipAddress: sip:bot-gateway-2@example.com
  registration.registryServerAddress: registrar.example.com
  registration.registryServerPort: 5060
  openai.apiKey: ${OPENAI_API_KEY}
  openai.realtimeModel: gpt-realtime
  openai.voice: shimmer
  openai.maxOutputTokens: inf
  openai.turnDetectionType: semantic_vad
  openai.turnDetectionEagerness: low
  openai.transcriptLoggingEnabled: true
  openai.inputTranscriptionModel: gpt-realtime-whisper
  openai.inputTranscriptionLanguage: ja
  bot.systemInstructions: "あなたはsession-2の電話応対を行うAIアシスタントです。回答は原則1文、できるだけ短く、相手が話し終わるまで待ってから返答してください。"
  bot.initialGreeting: "こちらは二番窓口です。ご用件をお話しください。"

logging:
  level: INFO

media:
  inboundQueueCapacity: 500
  outboundQueueCapacity: 10000

monitor:
  enabled: true
  bindAddress: 127.0.0.1
  port: 8080
  maxEvents: 500
